name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            artifact: Countdown-macOS-Apple-Silicon.dmg

          - arch: x86_64
            runner: macos-15-intel
            artifact: Countdown-macOS-Intel.dmg

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 PyInstaller

      - name: Build macOS app
        run: |
          rm -rf build dist

          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "Countdown" \
            --osx-bundle-identifier "com.countdowntimer.app" \
            countdown.py

      - name: Create DMG
        run: |
          brew install create-dmg

          create-dmg \
            --volname "Countdown Timer" \
            --window-size 700 450 \
            --icon-size 120 \
            --app-drop-link 520 200 \
            --icon "Countdown.app" 180 200 \
            "dist/${{ matrix.artifact }}" \
            "dist/Countdown.app"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Countdown-macOS-${{ matrix.arch }}
          path: dist/${{ matrix.artifact }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" \
              --title "Countdown Timer $TAG_NAME" \
              --notes "Countdown Timer release for Windows and macOS."

          gh release upload "$TAG_NAME" \
            "dist/${{ matrix.artifact }}" \
            --clobber