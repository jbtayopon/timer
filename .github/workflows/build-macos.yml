name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            artifact: TPX-macOS-Apple-Silicon.dmg

          - arch: x86_64
            runner: macos-15-intel
            artifact: TPX-macOS-Intel.dmg

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 PyInstaller Pillow

      - name: Check project files
        run: |
          echo "Checking project files..."

          test -f countdown.py
          test -f editor.py
          test -f storage.py
          test -f assets/splash.png
          test -f assets/tpx-icon.png

          echo "All required files found."

      - name: Prepare macOS icon
        run: |
          mkdir -p assets/tpx-icon.iconset

          sips -z 16 16 \
            assets/tpx-icon.png \
            --out assets/tpx-icon.iconset/icon_16x16.png

          sips -z 32 32 \
            assets/tpx-icon.png \
            --out assets/tpx-icon.iconset/icon_16x16@2x.png

          sips -z 32 32 \
            assets/tpx-icon.png \
            --out assets/tpx-icon.iconset/icon_32x32.png

          sips -z 64 64 \
            assets/tpx-icon.png \
            --out assets/tpx-icon.iconset/icon_32x32@2x.png

          sips -z 128 128 \
            assets/tpx-icon.png \
            --out assets/tpx-icon.iconset/icon_128x128.png

          sips -z 256 256 \
            assets/tpx-icon.png \
            --out assets/tpx-icon.iconset/icon_128x128@2x.png

          sips -z 256 256 \
            assets/tpx-icon.png \
            --out assets/tpx-icon.iconset/icon_256x256.png

          sips -z 512 512 \
            assets/tpx-icon.png \
            --out assets/tpx-icon.iconset/icon_256x256@2x.png

          sips -z 512 512 \
            assets/tpx-icon.png \
            --out assets/tpx-icon.iconset/icon_512x512.png

          sips -z 1024 1024 \
            assets/tpx-icon.png \
            --out assets/tpx-icon.iconset/icon_512x512@2x.png

          iconutil -c icns \
            assets/tpx-icon.iconset \
            -o assets/tpx-icon.icns

      - name: Build macOS app
        run: |
          rm -rf build dist

          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "TPX" \
            --icon "assets/tpx-icon.icns" \
            --add-data "assets/splash.png:assets" \
            --add-data "assets/tpx-icon.png:assets" \
            --osx-bundle-identifier "com.tpx.timerprox" \
            countdown.py

      - name: Verify macOS app
        run: |
          test -d "dist/TPX.app"
          test -f "dist/TPX.app/Contents/Resources/assets/splash.png"
          test -f "dist/TPX.app/Contents/Resources/assets/tpx-icon.png"

          echo "TPX.app created successfully."
          echo "Splash and icon assets are included."

      - name: Create DMG
        run: |
          brew install create-dmg

          create-dmg \
            --volname "TPX - Timer Pro X" \
            --window-size 700 450 \
            --icon-size 120 \
            --app-drop-link 520 200 \
            --icon "TPX.app" 180 200 \
            "dist/${{ matrix.artifact }}" \
            "dist/TPX.app"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPX-macOS-${{ matrix.arch }}
          path: dist/${{ matrix.artifact }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" \
              --title "TPX - Timer Pro X $TAG_NAME" \
              --notes "TPX - Timer Pro X release for Windows and macOS."

          gh release upload "$TAG_NAME" \
            "dist/${{ matrix.artifact }}" \
            --clobber